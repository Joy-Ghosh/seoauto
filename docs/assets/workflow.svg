<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">From evidence to a checked change</title><desc id="desc">First scan and inspect a finding. Next save and approve a draft, then apply it in your website editor. Finally re-scan and compare the expected and observed values.</desc>
<rect width="1120" height="340" rx="24" fill="#f8f8f2"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172015">
<text x="30" y="45" font-size="25" font-weight="700">One useful change, end to end.</text>
<rect x="30" y="74" width="330" height="224" rx="23" fill="#e2f295"/><rect x="395" y="74" width="330" height="224" rx="23" fill="#deecdc"/><rect x="760" y="74" width="330" height="224" rx="23" fill="#e9e1f3"/>
<g font-size="15" font-weight="700" fill="#4c6247"><text x="54" y="112">01 · OPPORTUNITIES</text><text x="419" y="112">02 · PLAN</text><text x="784" y="112">03 · RESULTS</text></g>
<g font-size="28" font-weight="700"><text x="54" y="156">See the evidence</text><text x="419" y="156">Make the edit</text><text x="784" y="156">Close the loop</text></g>
<g font-size="18" fill="#374b32"><text x="54" y="196">Scan. Pick a finding.</text><text x="54" y="224">Inspect the page and its links.</text><text x="419" y="196">Save and approve a draft.</text><text x="419" y="224">Apply it in your own editor.</text><text x="784" y="196">Re-scan the published page.</text><text x="784" y="224">Compare expected vs observed.</text></g>
<g stroke="#bcc9b0"><path d="M54 245H336M419 245H701M784 245H1066"/></g>
<g font-size="15" font-weight="650"><text x="54" y="275">What is wrong, and where?</text><text x="419" y="275">What exactly will change?</text><text x="784" y="275">Does the response match?</text></g>
<g fill="none" stroke="#3d5335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M369 183H386m-6-6 6 6-6 6M734 183H751m-6-6 6 6-6 6"/></g>
</g></svg>